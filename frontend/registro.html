<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorFix · Crear cuenta</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

    <header class="cabecera-registro">
        <a class="logo" href="login.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path>
            </svg>
            <span>MOTORFIX</span>
        </a>
        <a href="login.html" class="enlace-login">Ya tengo cuenta · Iniciar sesión</a>
    </header>

    <main class="registro">

        <!-- Formulario de registro de cliente (lo enviará registro.js con fetch a auth_sw.php) -->
        <form id="formRegistro" class="tarjeta-registro" novalidate>
            <div class="cabecera">
                <h1>Crear cuenta de cliente</h1>
                <p>Con tu cuenta podrás registrar tus vehículos y pedir cita previa.</p>
            </div>

            <!-- Datos que van a la tabla cliente (y el nombre a usuario) -->
            <fieldset>
                <legend>Datos personales</legend>

                <div class="rejilla">
                    <div class="campo">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" name="dni" placeholder="12345678A" maxlength="9" autocomplete="off" required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="600 000 000" maxlength="15" autocomplete="tel" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="nombre">Nombre y apellidos</label>
                    <input type="text" id="nombre" name="nombre" maxlength="80" autocomplete="name" required>
                </div>

                <div class="rejilla rejilla-direccion">
                    <div class="campo campo-calle">
                        <label for="calle">Calle</label>
                        <input type="text" id="calle" name="calle" maxlength="120" autocomplete="address-line1">
                    </div>

                    <div class="campo">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero" maxlength="10">
                    </div>

                    <div class="campo">
                        <label for="cp">Código postal</label>
                        <input type="text" id="cp" name="cp" maxlength="5" inputmode="numeric" autocomplete="postal-code">
                    </div>

                    <div class="campo">
                        <label for="localidad">Localidad</label>
                        <input type="text" id="localidad" name="localidad" maxlength="80" autocomplete="address-level2">
                    </div>
                </div>
            </fieldset>

            <!-- Datos que van a la tabla usuario -->
            <fieldset>
                <legend>Acceso</legend>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="nombre@correo.com" maxlength="120" autocomplete="email" required>
                </div>

                <div class="rejilla">
                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" required>
                    </div>

                    <div class="campo">
                        <label for="password2">Repetir contraseña</label>
                        <input type="password" id="password2" name="password2" autocomplete="new-password" required>
                        <!-- registro.js quitará .oculto y pondrá .campo-error si no coinciden -->
                        <span id="errorPassword" class="texto-error oculto">Las contraseñas no coinciden</span>
                    </div>
                </div>
            </fieldset>

            <!-- Aquí se mostrará el msg del servidor (éxito o error) -->
            <div id="mensaje" class="mensaje oculto" role="alert"></div>

            <div class="acciones">
                <a href="login.html" class="boton boton-secundario">Cancelar</a>
                <button type="submit" class="boton">Crear cuenta</button>
            </div>
        </form>

    </main>

    <footer>
        <p class="pie">Taller MotorFix · [ALMORADI C/Alicante n·27 ] · [722809520]</p>
    </footer>

</body>
</html>
